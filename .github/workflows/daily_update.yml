name: Hourly Dashboard Update

on:
  schedule:
    # 每小时执行(北京时间 8:00-19:00, 即 UTC 0:00-11:00, 周一至周五)
    # ETF份额数据通常17:00后发布, 延至19:00确保覆盖
    - cron: '0 0-11 * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - 'fetch_data.py'
      - 'gen_data.py'
      - 'build_html.py'
      - '.github/workflows/daily_update.yml'

concurrency:
  group: hourly-dashboard-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install akshare==1.19.1 pandas numpy
          pip install tushare || echo "tushare install failed (will use akshare only)"

      - name: Fetch latest data
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: python fetch_data.py

      - name: Fetch ETF flow data
        run: python fetch_etf_flow.py

      - name: Generate JSON data
        run: python gen_data.py

      - name: Build HTML dashboard
        run: python build_html.py

      - name: Copy dashboard.html to index.html (for GitHub Pages)
        run: cp dashboard.html index.html

      - name: Update version (timestamp so any code/data change triggers refresh)
        run: |
          echo "{\"version\":\"$(date -u +%Y%m%d%H%M%S)\",\"updated\":\"$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')\"}" > version.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/style_indices_v2.csv data/etf_flow.csv data/etf_price.csv dashboard_data.json dashboard_data.js dashboard.html index.html version.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Auto update $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')"
          # 推送：最多重试 3 次，每次先 rebase（schedule 与 workflow_dispatch 可能同时触发）
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "Pushed successfully"
              exit 0
            fi
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
          echo "Push failed after 3 attempts" >&2
          exit 1
